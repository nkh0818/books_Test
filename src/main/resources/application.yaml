# [1번 구역] 공통 설정 및 현재 사용할 모드 선택
spring:
  profiles:
    active: h2  # <--- 여기서 'mysql' 또는 'h2'로 딸깍 한 번에 바꿉니다!
  
  application:
    name: domain

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# API 키 설정 (공통)
api:
  weather:
    url: "http://apis.data.go.kr/1360000/MidFcstInfoService/getMidLandFcst"
    serviceKey: "공공데이터포탈키"
  tour:
    url: "http://apis.data.go.kr/B551011/KorService2/areaBasedList2"
    serviceKey: "공공데이터포탈키"

---
# [2번 구역] MySQL 모드 설정
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/autoTour?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        serialization:
          fail_on_empty_beans: false

---
# [3번 구역] H2(MySQL 없을 때) 모드 설정
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    # [수정] mem 대신 file:./data/autoTour 로 변경 (프로젝트 폴더 안에 data 폴더가 생기고 저장됨)
    url: jdbc:h2:file:./data/autoTour;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # [수정] create를 update로 변경 (데이터가 있으면 유지하고 없으면 생성함)
      ddl-auto: update
    show-sql: false # 로그가 너무 많으니 잠시 꺼두는 게 좋습니다.
    properties:
      hibernate:
        serialization:
          fail_on_empty_beans: false