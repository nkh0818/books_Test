<!-- upload.html -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 = 업로드</title>
</head>

<body>
    <h2>도서 업로드</h2>
    도서명: <input type="text" id="bookTitle" /><br>
    가격: <input type="number" id="bookPrice" /><br>
    이미지: <input type="file" id="fileInput" /><br>
    <button onclick="upload()"> 도서 등록 </button>

    <h3 id="result"></h3>



    <!-- AWS에서 제공하는 자바스크립트로도 접근이 가능하게 만든 라이브러리 CDN -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1571.0.min.js"></script>


    <!-- AWS객체를 이용해서 동작하는 코드를 작성 -->
    <script>
        // AWS 안에 객체에 내가 발급받은 ACCESS KEY,SecertAccessKey
        // 저장 

        // 자바스크립트에서 접근은 원래 안되요!
        // 1. 액세스 키,비밀 키  일단은 접속 가능하게 만들어줄께
        AWS.config.update({
            accessKeyId: "일반비밀!",
            secretAccessKey: "시크릿!",
            region: "ap-northeast-2"
        });
        // 2. S3객체 생성
        const s3 = new AWS.S3({
            // 이 요청이 진짜 너(AccessKey 주인) 맞는지 증명하는 
            // 서명의 방식!
            signatrueVersion: "v4"
        });

        //업로드 버튼을 클릭하면 실행해라!
        function upload() {
            //1. 업로드 버튼을 누르면 input태그에 있는 값을
            //   가져오기
            const file = document.getElementById("fileInput").files[0];
            const title = document.getElementById("bookTitle").value;
            const price = document.getElementById("bookPrice").value;
            // console.log(file);
            // 파일이 없으면 함수 종료해라!
            if (!file || !title || !price) { //파이프라인!!!!!
                alert("모든 정보를 입력하세요!");
                return;
            }

            //2. 파일을 잘 가져왔다면 S3에 저장할 정보
            //  -1. Bucket : 어디 폴더에 저장할꺼냐?(업로드 버킷명)
            //  -2. Key : S3에 저장될 경로(폴더명)/객체 이름
            //           메인에 올리고 싶으면 그냥 file.name
            //           내가 지정한 폴더에 저장 bag_images/+ file.name
            //  -3. Body:실제 업로드 될 파일객체 
            const params = {
                Bucket: "fullstack-nkh/Book",
                Key: file.name,
                Body: file,
                ContentType: file.type
                //  강제 a태그로 다운로드 될 수 있도록 지정!

            };

            //3. 실제 AWS s3로 전송하는 메서드
            // upload() 멀티파트 업로드를 자동으로 처리해주는 함수
            //          자동으로 AWS로 전송까지 해준다. 그래서
            //          응답을 받아온다.
            s3.upload(params, (err, data) => {
                const result = document.getElementById("result");

                if (err) {
                    result.textContent = "업로드 실패!\n" + err.message;
                } else {
                    // 1. S3 업로드 성공 시 받아온 URL
                    const imageUrl = data.Location;

                    // 2. 서버로 보낼 데이터 뭉치 만들기 (엔티티 필드명과 맞춰야 함)
                    const bookData = {
                        title: document.getElementById("bookTitle").value,
                        price: parseInt(document.getElementById("bookPrice").value), // 숫자로 변환
                        imageUrl: imageUrl,
                        user_Id: "admin" // 엔티티의 nullable=false 대응용 임시 아이디
                    };

                    // 3. 스프링 부트 컨트롤러로 전송 (Fetch API)
                    fetch("/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(bookData)
                    })
                        .then(response => response.text())
                        .then(msg => {
                            // DB 저장까지 완료되면 화면에 표시
                            result.innerHTML = `✅ 업로드 & DB 저장 성공!<br>
                                <small>${imageUrl}</small>`;
                            console.log("서버 응답:", msg);
                            alert("도서 등록 완료!");
                        })
                        .catch(error => {
                            console.error("DB 저장 에러:", error);
                            result.textContent = "S3는 성공했으나 DB 저장에 실패했습니다.";
                        });
                }
            });
        }
    </script>

</body>

</html>
